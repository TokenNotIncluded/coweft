name: Isolated UI workbench
on:
  push:
    branches: [workbench/discussion-ui]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Export locked dependency tree for local development
        run: tar -czf /tmp/coweft-workbench-deps.tar.gz -C web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-dependencies
          path: /tmp/coweft-workbench-deps.tar.gz
          retention-days: 1
