name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: coweft-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coweft
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coweft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coweft -d coweft"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://coweft:test-only-password@localhost:5432/coweft
      COWEFT_INTEROP_FIXTURE: /tmp/coweft-interop-fixture.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read the paired identity implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TokenNotIncluded/api.lmm.best
          ref: b78455ad6a0db054ed387d77ee94c12df4a2b540
          path: .identity-provider
          persist-credentials: false
          sparse-checkout: apps/api-go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .identity-provider/apps/api-go/go.mod
          cache-dependency-path: .identity-provider/apps/api-go/go.sum
      - name: Generate a real Go-signed public receipt for Rust verification
        run: go test ./oidcprovider -run TestExportInteroperabilityFixture -count=1
        working-directory: .identity-provider/apps/api-go
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install browser and Chinese system fonts for real-page screenshots
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-verification
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14
      - name: Export the actual built website for independent browser inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coweft-ui-runtime
          path: |
            web/dist/
            web/src/
            web/index.html
            web/package.json
            web/package-lock.json
            web/tsconfig.json
            web/vite.config.ts
            web/tests/
            web/playwright.config.ts
          retention-days: 14
  image:
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build deployable image without publishing or production credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: coweft:verification
          cache-from: type=gha
          cache-to: type=gha,mode=max
